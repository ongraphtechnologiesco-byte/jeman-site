<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders — Jeman Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/shared.css">
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="brandmark">Jeman Admin</div>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="orders.html" class="active">Orders</a>
      <a href="products.html">Products</a>
      <a href="inventory.html">Inventory</a>
      <a href="announcements.html">Announcements</a>
    </nav>
    <hr class="divider">
    <nav><a href="#" id="logoutLink">Sign out</a><a href="../index.html">View storefront ↗</a></nav>
  </aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <h1 style="font-size:26px;">Orders</h1>
      <div class="pill-toggle" id="filterRow">
        <button data-f="all" class="active">All</button>
        <button data-f="pending">Pending</button>
        <button data-f="payment_sent">Payment sent</button>
        <button data-f="paid">Paid</button>
        <button data-f="processing">Processing</button>
        <button data-f="shipped">Shipped</button>
        <button data-f="delivered">Delivered</button>
        <button data-f="cancelled">Cancelled</button>
      </div>
    </div>
    <div class="admin-panel" style="padding:0;">
      <table class="data-table">
        <thead><tr><th>Order</th><th>Phone</th><th>Items</th><th>Total</th><th>Status</th><th>Placed</th><th>Actions</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" style="color:var(--muted);font-size:14px;padding:24px;display:none;">No orders in this status yet.</p>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="msgModal" style="display:none;">
  <div class="modal-box">
    <h3 style="font-size:18px;">Message customer — <span id="msgRef"></span></h3>
    <div id="msgThread" style="max-height:280px;overflow:auto;margin:16px 0;"></div>
    <form id="msgForm" style="display:flex;gap:8px;">
      <input id="msgText" placeholder="Type a reply…" style="flex:1;padding:10px 12px;border:1px solid var(--rule);border-radius:var(--r);">
      <button class="btn btn-sm btn-primary" type="submit">Send</button>
    </form>
    <button class="btn btn-ghost btn-sm" id="closeMsg" style="margin-top:12px;">Close</button>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/store.js"></script>
<script src="guard.js"></script>
<script>
const { Orders: LocalOrders, money } = JemanStore;
let filter = 'all';
const live = window.JemanAPI && JemanAPI.live();

const NEXT = { paid: 'processing', processing: 'shipped', shipped: 'delivered' };

async function fetchOrders() {
  if (live) return JemanAPI.listOrders();
 return LocalOrders.all();
}

async function renderRows(){
  let orders = (await fetchOrders()).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  if (filter !== 'all') orders = orders.filter(o => o.status === filter);
  document.getElementById('rows').innerHTML = orders.map(o => `
    <tr style="${o.expiringSoon ? 'background:var(--tape);' : ''}">
      <td><b>${o.ref}</b>${o.expiringSoon ? ` <span class="status status-payment_sent" title="Reservation expiring soon">⚠ ${o.hoursRemaining}h left</span>` : ''}</td>
      <td>${o.phone||'—'}</td>
      <td>${o.items.reduce((s,i)=>s+i.qty,0)}</td>
      <td>${money(o.total)}</td>
      <td><span class="status status-${o.status}">${o.status.replace('_',' ')}</span></td>
      <td style="font-size:12px;color:var(--muted);">${new Date(o.createdAt).toLocaleDateString()}</td>
      <td style="display:flex;gap:6px;flex-wrap:wrap;">${actionsFor(o)} <button class="btn btn-sm btn-ghost" data-msg="${o.ref}">Message${o.messages&&o.messages.length?` (${o.messages.length})`:''}</button></td>
    </tr>`).join('');
  document.getElementById('empty').style.display = orders.length ? 'none' : 'block';

  document.querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
    const [action, id] = [b.dataset.act, b.dataset.id];
    try {
      if (live) {
        if (action === 'stk') await JemanAPI.sendSTKPush(id);
        else alert('Marking paid/failed/advancing status manually is a local-demo action — in live mode, "paid" comes from the real KCB IPN callback automatically. Use this only for testing.');
      } else {
         if (action === 'stk') LocalOrders.sendSTKPush(id);
        else if (action === 'paid') LocalOrders.simulateIPNSuccess(id);
        else if (action === 'fail') LocalOrders.simulateIPNFailure(id);
        else LocalOrders.updateStatus(id, action);
      }
    } catch (e) { alert(e.message); }
    renderRows();
  });
  document.querySelectorAll('[data-msg]').forEach(b => b.onclick = () => openMessages(b.dataset.msg, orders.find(o=>o.ref===b.dataset.msg)));
}
function actionsFor(o){
  if (o.status === 'pending') return `<button class="btn btn-sm btn-brass" data-act="stk" data-id="${live?o.ref:o.id}">Send STK</button>`;
  if (o.status === 'payment_sent' && !live) return `<button class="btn btn-sm btn-ghost" data-act="paid" data-id="${o.id}">Mark paid</button> <button class="btn btn-sm btn-ghost" data-act="fail" data-id="${o.id}">Mark failed</button>`;
  if (NEXT[o.status] && !live) return `<button class="btn btn-sm btn-ghost" data-act="${NEXT[o.status]}" data-id="${o.id}">Mark ${NEXT[o.status]}</button>`;
  return '<span style="color:var(--muted);font-size:12px;">—</span>';
}

let msgRef = null;
function openMessages(ref, order) {
  msgRef = ref;
  document.getElementById('msgRef').textContent = ref;
  document.getElementById('msgThread').innerHTML = (order.messages||[]).length
    ? order.messages.map(m => `<div style="text-align:${m.from==='admin'?'right':'left'};margin-bottom:8px;">
        <span style="display:inline-block;max-width:80%;padding:8px 12px;border-radius:var(--r);font-size:13px;background:${m.from==='admin'?'var(--indigo)':'var(--chalk)'};color:${m.from==='admin'?'#fff':'var(--ink)'};">${m.text}</span></div>`).join('')
    : '<p style="color:var(--muted);font-size:13px;">No messages yet.</p>';
  document.getElementById('msgModal').style.display = 'flex';
}
document.getElementById('closeMsg').onclick = () => document.getElementById('msgModal').style.display = 'none';
document.getElementById('msgForm').onsubmit = async e => {
  e.preventDefault();
  if (!live) { alert('Messaging needs the live backend connected.'); return; }
  const text = document.getElementById('msgText').value.trim();
  if (!text) return;
  try {
    await JemanAPI.sendMessage(msgRef, 'admin', text);
    document.getElementById('msgText').value = '';
    document.getElementById('msgModal').style.display = 'none';
    renderRows();
  } catch (err) { alert(err.message); }
};

document.querySelectorAll('#filterRow button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#filterRow button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); filter = b.dataset.f; renderRows();
});
renderRows();
</script>
</body>
</html>

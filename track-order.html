<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track your order — Jeman Collections</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shared.css">
</head>
<body>

<div class="subnav"><div class="wrap">
  <a href="index.html">← Back to shop</a>
  <span class="brandmark">Jeman Collections</span>
  <a href="account.html">Your account</a>
</div></div>

<div class="wrap-narrow" style="padding-top:40px;padding-bottom:80px;">
  <div class="eyebrow">Order status</div>
  <h1 style="font-size:34px;">Track your order</h1>
  <p style="color:var(--muted);">Enter your order reference (e.g. JM12345678) and the phone number used at checkout.</p>

  <form id="trackForm" class="card" style="padding:24px;max-width:440px;">
    <div class="form-row"><label for="ref">Order reference</label><input id="ref" placeholder="JM12345678" required></div>
    <div class="form-row"><label for="phone">Phone number</label><input id="phone" placeholder="0722 000 000" required></div>
    <button class="btn btn-primary btn-block" type="submit">Track order</button>
    <div id="trackError" class="form-error"></div>
  </form>

  <div id="result" style="margin-top:32px;"></div>
</div>

<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script>
const { Orders: LocalOrders, money } = JemanStore;
const STAGES = ['pending','payment_sent','paid','processing','shipped','delivered'];
const LABELS = { pending:'Order placed', payment_sent:'Payment sent', paid:'Paid', processing:'Processing', shipped:'Shipped', delivered:'Delivered', cancelled:'Cancelled' };
let currentRef = null, currentPhone = null;

document.getElementById('trackForm').onsubmit = async e => {
  e.preventDefault();
  const ref = document.getElementById('ref').value.trim().toUpperCase();
  const phone = document.getElementById('phone').value.trim();
  const err = document.getElementById('trackError');
  const result = document.getElementById('result');

  let order = null;
  try {
    if (window.JemanAPI && JemanAPI.live()) {
      order = await JemanAPI.getOrder(ref, phone);
    } else {
      order = LocalOrders.all().find(o => o.ref.toUpperCase() === ref && o.phone === phone);
    }
  } catch (e) { /* falls through to not-found below */ }

  if (!order) {
    err.textContent = "We couldn't find an order matching that reference and phone number.";
    result.innerHTML = '';
    return;
  }
  err.textContent = '';
  currentRef = order.ref; currentPhone = phone;
  const cancelled = order.status === 'cancelled';
  const currentIdx = STAGES.indexOf(order.status);
  const warn = order.expiringSoon ? `<p style="background:var(--tape);color:var(--brass);font-size:13px;padding:10px 14px;border-radius:var(--r);margin-top:14px;">This reservation expires soon (~${order.hoursRemaining}h left) — pay now to keep your items held.</p>` : '';
  result.innerHTML = `
    <div class="card" style="padding:24px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
        <div><b style="font-size:18px;">${order.ref}</b><div style="font-size:12px;color:var(--muted);">${new Date(order.createdAt).toLocaleString()}</div></div>
        <span class="status status-${order.status}">${LABELS[order.status]}</span>
      </div>
      ${cancelled ? '<p style="color:var(--bad);font-size:14px;">This order was cancelled — items were released back to stock. Contact us if this is unexpected.</p>' :
        `<div style="display:flex;gap:4px;margin-bottom:20px;">
          ${STAGES.map((s,i) => `<div style="flex:1;height:6px;border-radius:4px;background:${i<=currentIdx?'var(--brass)':'var(--rule)'}"></div>`).join('')}
        </div>`}
      <p style="font-size:13px;color:var(--muted);">${order.items.length} item(s) · Total ${money(order.total)}</p>
      ${warn}
    </div>
    <div class="card" style="padding:24px;margin-top:16px;">
      <h3 style="font-size:16px;">Message us about this order</h3>
      <div id="msgThread" style="margin-bottom:14px;"></div>
      <form id="msgForm" style="display:flex;gap:8px;">
        <input id="msgText" placeholder="Ask a question about your order…" style="flex:1;padding:10px 12px;border:1px solid var(--rule);border-radius:var(--r);">
        <button class="btn btn-sm btn-primary" type="submit">Send</button>
      </form>
    </div>`;
  renderMessages(order.messages || []);
  document.getElementById('msgForm').onsubmit = sendMessage;
};

function renderMessages(messages) {
  const el = document.getElementById('msgThread');
  el.innerHTML = messages.length ? messages.map(m => `
    <div style="text-align:${m.from==='admin'?'left':'right'};margin-bottom:8px;">
      <span style="display:inline-block;max-width:80%;padding:8px 12px;border-radius:var(--r);font-size:13px;background:${m.from==='admin'?'var(--chalk)':'var(--indigo)'};color:${m.from==='admin'?'var(--ink)':'#fff'};">${m.text}</span>
    </div>`).join('') : '<p style="color:var(--muted);font-size:13px;">No messages yet.</p>';
}

async function sendMessage(e) {
  e.preventDefault();
  const text = document.getElementById('msgText').value.trim();
  if (!text || !window.JemanAPI || !JemanAPI.live()) {
    if (!JemanAPI || !JemanAPI.live()) alert('Messaging needs the live backend connected (set JEMAN_API_BASE_URL in js/config.js).');
    return;
  }
  try {
    const order = await JemanAPI.sendMessage(currentRef, 'customer', text);
    renderMessages(order.messages || []);
    document.getElementById('msgText').value = '';
  } catch (err) { alert(err.message); }
}
</script>
</body>
</html>
